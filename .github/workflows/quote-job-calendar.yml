name: Quote job calendar checks
on:
  push:
    branches: [main]
    paths:
      - 'apps-script/QuoteJobCalendar.gs'
      - 'apps-script/WorkCalendar.gs'
      - 'apps-script/AttendanceRoutes.gs'
      - 'quote-job-calendar.js'
      - 'tests/quote-job-calendar.test.cjs'
      - '.github/workflows/quote-job-calendar.yml'
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify job lookup, company boundaries, repeat saves, login links and syntax
        run: node --test tests/quote-job-calendar.test.cjs
