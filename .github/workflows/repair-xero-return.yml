name: Repair Xero return screen
on:
  push:
    branches: [fix/xero-return-button]
    paths: [.github/workflows/repair-xero-return.yml]
permissions:
  contents: read
concurrency:
  group: apps-script-production
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch only the published Xero callback helper
        env:
          SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
          DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
          CLASP_CREDENTIALS: ${{ secrets.APPS_SCRIPT_CLASP_CREDENTIALS }}
        run: node tools/deploy-xero-return.mjs
